<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTI Setu</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="launcher">
    <header class="lh-head">
      <span class="lh-mark" aria-hidden="true">&#9784;</span>
      <div>
        <div class="lh-name">RTI Setu</div>
        <div class="lh-tag">सत्यमेव जयते · Truth alone prevails</div>
      </div>
    </header>

    <div class="lh-status" id="statusLine">No draft yet</div>

    <button class="lh-btn primary" id="openAppBtn" type="button">Open RTI Setu</button>

    <button class="lh-btn fill" id="fillNowBtn" type="button" hidden>↗ Fill the portal form now</button>
    <div class="lh-note" id="fillNote" hidden></div>

    <footer class="lh-foot">
      <span id="savedText">RTI Act, 2005</span>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
