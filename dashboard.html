<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTI Setu · Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="dash">
    <header class="dash-topbar">
      <div class="dash-brand">
        <span class="wheel" id="wheel" aria-hidden="true"></span>
        <div>
          <div class="dash-title">RTI Setu · Dashboard</div>
          <div class="dash-sub" id="syncState">Local record · not synced</div>
        </div>
      </div>
      <div class="dash-avatar" id="dashAvatar">
        <button class="login-cta" id="loginCta" type="button">Create free account</button>
      </div>
    </header>

    <div class="dash-body">
      <aside class="dash-left">
        <div class="ds-lbl">Overview</div>
        <div class="stat-grid" id="statGrid"></div>

        <div class="ds-lbl">Tracks</div>
        <div class="track-list" id="trackList"></div>

        <div class="ds-lbl">City leaderboard <span class="lb-note" id="lbNote">(create account to join)</span></div>
        <div class="lb-list" id="lbList"></div>
      </aside>

      <main class="dash-right">
        <div class="ds-head">
          <div class="ds-lbl">All RTIs</div>
          <div class="filters" id="filters">
            <button class="filter active" data-filter="all" type="button">All</button>
            <button class="filter" data-filter="pending" type="button">Awaiting</button>
            <button class="filter" data-filter="received" type="button">Received</button>
            <button class="filter" data-filter="appeal" type="button">Appeals</button>
          </div>
        </div>
        <div class="rti-list" id="rtiList"></div>
        <div class="empty" id="emptyState" hidden>
          <div class="empty-wheel">☼</div>
          <div class="empty-title">No RTIs yet</div>
          <div class="empty-sub">File your first RTI from the extension popup. It'll appear here with a 30-day deadline timer.</div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
